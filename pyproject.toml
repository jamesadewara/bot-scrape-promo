[project]
name = "promoscout"
version = "1.0.0"
description = "Jumia deep-discount (80%+) scout bot: polite, robots.txt-compliant, human-reviewed."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14",
    "protego>=0.7",
    "selectolax>=1.0",
    "yarl>=1.25",
    "w3lib>=2.6",
    "pydantic-settings>=2.16",
    "structlog>=26.1",
    "rich>=15.0",
    "streamlit>=1.67",
]

[dependency-groups]
dev = ["pytest>=9.2", "pytest-asyncio>=1.5"]

[project.scripts]
promoscout = "promoscout.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["promoscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
