services:
  bot:
    build: .
    image: promoscout:latest
    command: ["python", "-m", "promoscout", "auto", "--quiet"]
    env_file:
      - path: .env
        required: false
    volumes:
      - promoscout-data:/app/data
    restart: unless-stopped
    stop_grace_period: 30s   # time to save the checkpoint on `docker compose stop`

  review:
    build: .
    image: promoscout:latest
    depends_on:
      - bot
    command: ["streamlit", "run", "review_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    env_file:
      - path: .env
        required: false
    volumes:
      - promoscout-data:/app/data
    # Published on the server's public IP: http://<public-ip>:8501
    # Set PROMOSCOUT_REVIEW_PASSWORD in .env first, or the page refuses to start (see review_app.py).
    # SSH tunnel only instead: change to "127.0.0.1:8501:8501".
    ports:
      - "8501:8501"
    environment:
      PROMOSCOUT_REVIEW_PUBLIC: "true"
    restart: unless-stopped

volumes:
  promoscout-data:
