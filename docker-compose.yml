services:
  bot:
    build: .
    image: promoscout:latest
    command: ["python", "-m", "promoscout", "auto", "--quiet"]
    env_file:
      - path: .env
        required: false
    volumes:
      - promoscout-data:/app/data
    restart: unless-stopped
    stop_grace_period: 30s   # time to save the checkpoint on `docker compose stop`

  review:
    build: .
    image: promoscout:latest
    depends_on:
      - bot
    command: ["streamlit", "run", "review_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    env_file:
      - path: .env
        required: false
    volumes:
      - promoscout-data:/app/data
    # Only reachable from the server itself: open it through an SSH tunnel (see RUNBOOK).
    # The review page has no login, so never publish it on 0.0.0.0.
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped

volumes:
  promoscout-data:
